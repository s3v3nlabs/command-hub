name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # Build must not require secrets. Leave keys empty.
          SECURE_MODE: "0"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency audit (non-force; report only majors)
        run: |
          npm audit --omit=dev --audit-level=critical || true
          npm audit --audit-level=high || echo "::warning::npm audit reported high+ issues (see docs/DEPENDENCY_NOTES.md)"
